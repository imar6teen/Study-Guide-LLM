<!DOCTYPE html>

<body class="bg-surface-container-low font-body-md text-on-surface flex items-center justify-center min-h-screen">
<main class="w-full max-w-md">
<div class="flex flex-col w-full bg-surface">
<div class="relative w-full h-48 bg-primary overflow-hidden flex items-center justify-center shadow-md">
<div class="absolute inset-0 opacity-10">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternUnits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect class="text-on-primary" fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="relative z-10 flex flex-col items-center p-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-primary text-center mb-base">Study Guide LLM</h1>
<p class="font-body-md text-body-md text-primary-fixed-dim text-center">Your Academic Co-Pilot</p>
</div>
</div>
<div class="flex-1 w-full max-w-2xl mx-auto px-margin-mobile md:px-margin-desktop py-lg -mt-md relative z-20">
<div class="bg-surface-container-lowest rounded-xl shadow-lg p-md md:p-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Master any subject with AI-powered mindmaps.</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-lg">Personalized learning paths, interactive visualizations, and scholarly citations.</p>
<form class="space-y-md" id="signup-form">
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs transition-colors group-focus-within:text-primary" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md py-sm pl-xl pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="fullName" placeholder="Dr. Jane Doe" type="text">
</div>
</div>
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs transition-colors group-focus-within:text-primary" for="email">University Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary">school</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md py-sm pl-xl pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="email" placeholder="jane.doe@university.edu" type="email">
</div>
</div>
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs transition-colors group-focus-within:text-primary" for="password">Create Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md py-sm pl-xl pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" id="password" placeholder="••••••••" type="password">
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-md shadow-md hover:bg-on-primary-fixed hover:shadow-lg transition-all flex items-center justify-center gap-xs mt-lg" type="button">
          Join for free
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed underline transition-colors" href="/app/signin">Already have an account? Sign In</a>
</div>
</div>
</div>
</div>
</main>
</body>
</html>
