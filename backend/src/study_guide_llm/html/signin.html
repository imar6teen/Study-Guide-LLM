<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - Study Guide LLM</title>
<style>
@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config={theme:{extend:{colors:{"primary-fixed-dim":"#bdc2ff","error-container":"#ffdad6","on-surface":"#191c1e","on-tertiary-fixed-variant":"#3a485b","on-tertiary":"#ffffff","primary-fixed":"#e0e0ff","surface-container-highest":"#e0e3e5","secondary":"#795900","surface-tint":"#4c56af","surface-container-low":"#f2f4f6","on-surface-variant":"#454652","on-primary":"#ffffff","secondary-container":"#fec330","error":"#ba1a1a","surface-bright":"#f7f9fb","on-tertiary-container":"#8b99af","tertiary-container":"#233143","surface-container":"#eceef0","background":"#f7f9fb","outline":"#767683","on-secondary":"#ffffff","surface-container-high":"#e6e8ea","on-background":"#191c1e","primary-container":"#1a237e","on-secondary-fixed":"#261a00","on-error-container":"#93000a","tertiary-fixed-dim":"#b9c7df","secondary-fixed-dim":"#f8bd2a","surface-container-lowest":"#ffffff","surface":"#f7f9fb","on-primary-container":"#8690ee","on-primary-fixed-variant":"#343d96","inverse-primary":"#bdc2ff","tertiary-fixed":"#d5e3fc","on-error":"#ffffff","on-tertiary-fixed":"#0d1c2e","inverse-surface":"#2d3133","surface-dim":"#d8dadc","on-primary-fixed":"#000767","surface-variant":"#e0e3e5","on-secondary-container":"#6f5100","secondary-fixed":"#ffdfa0","tertiary":"#0d1c2e","primary":"#000666","outline-variant":"#c6c5d4","inverse-on-surface":"#eff1f3","on-secondary-fixed-variant":"#5c4300"},borderRadius:{DEFAULT:"0.125rem",lg:"0.25rem",xl:"0.5rem",full:"0.75rem"},spacing:{md:"24px",base:"8px",gutter:"24px",lg:"48px",xs:"4px","margin-mobile":"16px",sm:"12px",xl:"80px","margin-desktop":"64px"},fontFamily:{"headline-lg-mobile":["Playfair Display"],"label-md":["Inter"],"headline-xl":["Playfair Display"],"headline-md":["Playfair Display"],"body-lg":["Inter"],code:["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"headline-lg":["Playfair Display"]},fontSize:{"headline-lg-mobile":["28px",{lineHeight:"36px",fontWeight:"600"}],"label-md":["14px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"600"}],"headline-xl":["48px",{lineHeight:"60px",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],code:["14px",{lineHeight:"20px",fontWeight:"400"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"body-sm":["14px",{lineHeight:"20px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",fontWeight:"600"}]}}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-surface-container-low font-body-md text-on-surface flex items-center justify-center min-h-screen">
<main class="w-full max-w-md">
<div class="flex flex-col w-full h-full justify-center items-center px-4 py-xl bg-surface-container-lowest">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-20">
<svg class="absolute w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="48" id="grid" patternUnits="userSpaceOnUse" width="48">
<path class="text-outline-variant" d="M 48 0 L 0 0 0 48" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="relative z-10 w-full max-w-[400px] flex flex-col space-y-lg">
<div class="flex flex-col items-center text-center space-y-sm">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-base shadow-sm">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                    school
                </span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">Sign In</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                Ready to continue your academic journey?
            </p>
</div>
<form class="flex flex-col space-y-md w-full bg-surface-container rounded-xl p-md shadow-md" id="signin-form">
<div class="flex flex-col space-y-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-xs" for="email">Institutional Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                        mail
                    </span>
<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface rounded-lg pl-xl pr-sm py-sm outline-none border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200" id="email" placeholder="scholar@university.edu" required="" type="email">
</div>
</div>
<div class="flex flex-col space-y-xs relative group">
<div class="flex justify-between items-center ml-xs mr-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors underline decoration-transparent hover:decoration-current underline-offset-4" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                        lock
                    </span>
<input class="w-full bg-surface-container-lowest font-body-md text-body-md text-on-surface rounded-lg pl-xl pr-sm py-sm outline-none border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">
                            visibility_off
                        </span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md uppercase tracking-widest py-sm rounded-lg hover:bg-on-primary-fixed-variant transition-all duration-300 shadow-sm hover:shadow-md active:scale-[0.98] mt-base flex items-center justify-center space-x-2" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-[18px]">
                    arrow_forward
                </span>
</button>
</form>
<div class="flex justify-center items-center pt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to Study Guide LLM? 
                <a class="text-primary font-medium hover:text-on-primary-fixed-variant transition-colors ml-1 border-b border-primary/30 hover:border-primary pb-0.5" href="/app/signup">
                    Create an account
                </a>
</p>
</div>
</div>
</div>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibility-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            visibilityIcon.textContent = 'visibility';
        } else {
            passwordInput.type = 'password';
            visibilityIcon.textContent = 'visibility_off';
        }
    }
</script>
</main>
</body>
</html>
