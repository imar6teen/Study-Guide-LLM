# Copy to env.yaml (git-ignored) and fill in. Included by app.yaml.
# NOTE: no LLM keys here — users bring their own key (BYOK) from the frontend.
env_variables:
  APP_ENV: "prod"

  DB_URI: "postgresql://USER:PASSWORD@HOST:5432/DATABASE"

  SECRET_KEY: "change_me_to_a_long_random_string"
  SESSION_MAX_AGE: "604800"
  MAX_AGE: "300"

  # "none" when the frontend is hosted on a different site than the backend
  COOKIE_SAMESITE: "none"

  RESEND_API_KEY: "re_xxxxxxxxxxxxxxxxxxxx"
  MAIL_FROM: "Study Guide LLM <onboarding@resend.dev>"
  MAIL_SALT: "change_me_to_a_random_salt"

  FRONTEND_URI: "https://your-frontend.example.com"
  BACKEND_URI: "https://YOUR_PROJECT_ID.REGION_ID.r.appspot.com"

  DEFAULT_IMAGE: "default.png"

  LANGSMITH_API_KEY: ""
  LANGSMITH_TRACING: "false"
  LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
  LANGSMITH_PROJECT: "study guide llm"

  FIRECRAWL_API_KEY: "fc-xxxxxxxxxxxxxxxxxxxx"
