[project]
name = "study-guide-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "imar6teen", email = "aimaranand02@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "psycopg2[binary]>=2.9.12",
    "pydantic[email]>=2.13.4",
    "resend>=2.42.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "uuid>=1.30",
    "uvicorn>=0.52.1",
]

[project.scripts]
study-guide-llm = "study_guide_llm:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
